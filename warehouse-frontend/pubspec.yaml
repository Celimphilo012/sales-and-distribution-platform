name: warehouse_frontend
description: "Warehouse System — Flutter front end (standalone, talks only to /warehouse-node on port 3200)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.1
  google_fonts: ^8.2.1
  phosphor_flutter: ^2.1.0
  file_picker: ^13.1.0
  web: ^1.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
